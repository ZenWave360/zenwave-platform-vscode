name: CI

# Verification only (spec:release#r-r13): nothing here can publish, and nothing here holds a registry credential.
# A pull request into develop is the dry run of the pre-release: it goes through exactly the checks, the stamp and the
# package that a merge will publish.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
    with:
      channel: ${{ github.base_ref == 'develop' && 'pre-release' || 'development' }}
      run-number: ${{ github.run_number }}
