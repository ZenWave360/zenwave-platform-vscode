name: Pre-release

# A push to develop that changes the extension publishes a pre-release (spec:release#r-r7). Do not rename this file:
# the run number is the patch of the version, and it restarts for a new file name (spec:release#r-r8).
#
#   verify   no credential: the checks, the stamp, the package, the smoke tests; uploads the VSIX
#   publish  the only job with registry access: publishes those bytes to both registries, whichever way each goes
#   trace    after the registries were tried: the tag and the GitHub pre-release, with the VSIX attached

on:
  push:
    branches:
      - develop
    paths:
      # Everything, except documentation, agent configuration, other workflows and Markdown at the repository root.
      # A later pattern overrides an earlier one, so the two workflows of this pipeline count again.
      - '**'
      - '!docs/**'
      - '!.claude/**'
      - '!.github/**'
      - '!*.md'
      - '.github/workflows/pre-release.yml'
      - '.github/workflows/verify.yml'

# One publication at a time. A run that is already publishing is never cancelled; of the runs waiting behind it, only the
# newest stays, so the newest commit ends up as the highest version and one in between may be skipped.
concurrency:
  group: pre-release
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
    with:
      channel: pre-release
      run-number: ${{ github.run_number }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: vscode-prerelease
    permissions:
      contents: read
      id-token: write
    outputs:
      marketplace: ${{ steps.marketplace.outcome }}
      openvsx: ${{ steps.openvsx.outcome }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      # Exact versions, so a new release of the tools cannot change what publishes. vsce 4.1.0 is the first to have --oidc.
      VSCE_VERSION: 4.1.0
      OVSX_VERSION: 1.3.0

    steps:
      - name: Download the verified VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-vsix
          path: artifacts

      - name: Identify the VSIX
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum --check SHA256SUMS
          vsix=$(ls zenwave-platform-*.vsix)
          [ "$(printf '%s\n' "$vsix" | wc -l)" -eq 1 ]
          [ "$(unzip -p "$vsix" extension/package.json | jq -r .version)" = "$VERSION" ]
          [ "$(jq -r .version release-info.json)" = "$VERSION" ]
          [ "$(jq -r .preRelease release-info.json)" = true ]
          echo "VSIX=$PWD/$vsix" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # A token when the environment holds one, trusted publishing when it does not, and no fallback between them:
      # deleting the secret is how this moves to trusted publishing (spec:release#r-r13). --skip-duplicate counts a
      # version the registry already has as done, so a re-run only publishes where it is missing (spec:release#r-r12).
      # --pre-release makes vsce refuse a VSIX that is not flagged as one.
      - name: Publish to the VS Code Marketplace
        id: marketplace
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -uo pipefail
          credential=(--oidc)
          if [ -n "${VSCE_PAT:-}" ]; then
            echo "Publishing with the VSCE_PAT of this environment."
            credential=()
          else
            echo "No VSCE_PAT in this environment: publishing with trusted publishing (--oidc)."
            unset VSCE_PAT
          fi
          status=0
          npx --yes "@vscode/vsce@$VSCE_VERSION" publish --packagePath "$VSIX" --pre-release --skip-duplicate "${credential[@]}" 2>&1 \
            | tee "$RUNNER_TEMP/marketplace.log" || status=$?
          grep -qi 'already published' "$RUNNER_TEMP/marketplace.log" && echo 'already=true' >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish the same VSIX to Open VSX
        id: openvsx
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        # ovsx ignores --pre-release for a prepackaged extension: Open VSX reads the flag from the VSIX manifest.
        run: |
          set -uo pipefail
          credential=(--trusted-publishing)
          if [ -n "${OVSX_PAT:-}" ]; then
            echo "Publishing with the OVSX_PAT of this environment."
            credential=()
          else
            echo "No OVSX_PAT in this environment: publishing with trusted publishing."
            unset OVSX_PAT
          fi
          status=0
          npx --yes "ovsx@$OVSX_VERSION" publish "$VSIX" --skip-duplicate "${credential[@]}" 2>&1 \
            | tee "$RUNNER_TEMP/openvsx.log" || status=$?
          grep -qi 'already published' "$RUNNER_TEMP/openvsx.log" && echo 'already=true' >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Report what each registry did
        if: ${{ !cancelled() }}
        env:
          MARKETPLACE: ${{ steps.marketplace.outcome }}
          MARKETPLACE_HAD_IT: ${{ steps.marketplace.outputs.already }}
          OPENVSX: ${{ steps.openvsx.outcome }}
          OPENVSX_HAD_IT: ${{ steps.openvsx.outputs.already }}
        run: |
          describe() {
            case "$1" in
              success) [ "$2" = true ] && echo "already had $VERSION, nothing published" || echo "published $VERSION" ;;
              failure) echo "FAILED: $VERSION is not there" ;;
              *) echo "not attempted: $VERSION is not there" ;;
            esac
          }
          {
            echo "## Pre-release $VERSION"
            echo
            echo "Built from \`$GITHUB_SHA\`."
            echo
            echo '| Registry | Outcome |'
            echo '| --- | --- |'
            echo "| VS Code Marketplace | $(describe "$MARKETPLACE" "$MARKETPLACE_HAD_IT") |"
            echo "| Open VSX | $(describe "$OPENVSX" "$OPENVSX_HAD_IT") |"
            echo
            echo '| Package in the VSIX | Version |'
            echo '| --- | --- |'
            jq -r '.packages | to_entries[] | "| \(.key) | \(.value) |"' artifacts/release-info.json
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MARKETPLACE" != success ] || [ "$OPENVSX" != success ]; then
            echo "::error::A version cannot be withdrawn: run this workflow's failed jobs again to finish publishing $VERSION."
            exit 1
          fi

  trace:
    needs:
      - verify
      - publish
    # After the registries were tried, whichever way they went; never for a build that did not verify. It fails when a
    # registry did, so the run is not reported as a success and re-running the failed jobs brings the notes up to date.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.publish.outputs.marketplace != '' && needs.publish.outputs.marketplace != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.verify.outputs.version }}
      MARKETPLACE: ${{ needs.publish.outputs.marketplace }}
      OPENVSX: ${{ needs.publish.outputs.openvsx }}

    steps:
      - name: Download the verified VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-vsix
          path: artifacts

      - name: Create the tag and the GitHub pre-release
        run: |
          set -euo pipefail
          tag="v$VERSION-pre"
          vsix=$(ls artifacts/zenwave-platform-*.vsix)
          existing=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::$tag already points at $existing, not at $GITHUB_SHA"
            exit 1
          fi
          {
            cat artifacts/release-notes.md
            echo
            echo "Built from $GITHUB_SHA. VS Code Marketplace: $MARKETPLACE. Open VSX: $OPENVSX."
          } > notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            # A re-run: one tag, one release, and the VSIX stays the file first attached.
            gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "$(basename "$vsix")" ||
              gh release upload "$tag" "$vsix"
            gh release edit "$tag" --notes-file notes.md --prerelease
          else
            gh release create "$tag" "$vsix" --target "$GITHUB_SHA" --prerelease \
              --title "ZenWave Platform $VERSION (pre-release)" --notes-file notes.md
          fi
          echo "Tag and GitHub pre-release: $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Do not report success when a registry failed
        if: ${{ needs.publish.result != 'success' }}
        run: |
          echo "::error::A registry did not take $VERSION, so this run is a failure; the tag and release record the build."
          exit 1
