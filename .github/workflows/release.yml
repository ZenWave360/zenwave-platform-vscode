name: Release

# A tag vMAJOR.MINOR.PATCH publishes a stable release, once a reviewer approves (spec:release#r-r11).
# Creating a GitHub release that creates such a tag counts as creating the tag.
#
#   verify   no credential: the tag is on main and matches the manifest, its release notes exist and are not a draft, no
#            pre-release tag of that version exists, the stable pins, a current SDK catalogue, then the same build checks
#            as every other build
#   publish  waits for the reviewer of the vscode-release environment, then publishes the verified bytes to both registries
#
#   release  after the registries were tried (not when publish never ran): the GitHub release for the tag, with the notes
#            file and the line with the commit and the registry outcomes (spec:release#r-r10, r-r15)
#   sync     the release commit into develop through a pull request, then a pre-release run on develop
#
# The tag pattern matches only a stable-shaped tag: v0.1.99-pre starts nothing here, and neither does the tag the
# pre-release workflow creates. A stable release is a new build from its own tag, never a promoted pre-release.
#
# release-on-main.yml starts this workflow with workflow_dispatch on the tag it pushed, because a tag pushed with the
# workflow's own token starts nothing. The run's ref is then the tag, so the vscode-release environment, limited to v*
# tags, applies as it does to a tag pushed by hand, and its secrets are read here with nothing passed from anywhere.
# A dispatch on a branch or on any other tag does nothing.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    # A tag push is always a tag. A dispatch must be on one too; whether it is a stable tag of main is verify's check.
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
    with:
      channel: stable

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: vscode-release
    permissions:
      contents: read
      id-token: write
    outputs:
      marketplace: ${{ steps.marketplace.outcome }}
      openvsx: ${{ steps.openvsx.outcome }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}

    steps:
      # The version is an output of verify, which ran third-party build code, so it is not trusted. It has to be
      # major.minor.patch with no leading zero, the same rule as release-rules.mjs, before any step uses it. A shell
      # test, not that script: this job must not run anything from the artifact, and it checks out only the tools.
      - name: Check the version is major.minor.patch
        run: |
          set -euo pipefail
          version_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$VERSION" =~ $version_re ]]; then
            echo "::error::The version from verify is not major.minor.patch with no leading zeros, so this job stops."
            exit 1
          fi

      # The publishing tools come from the commit, never from the artifact: verify ran third-party build code in its tree
      # before it uploaded, so nothing it produced may choose what runs next to a registry token. Only these two files
      # are fetched, with no credential left in the checkout, and before any step that holds a secret (spec:release#r-r13).
      - name: Check out the publishing tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: publish-tools
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The VSIX, release-info.json and the notes are only read as data from here on; nothing in artifacts/ is run or
      # installed.
      - name: Download the verified VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-vsix
          path: artifacts

      - name: Identify the VSIX
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum --check SHA256SUMS
          vsix=$(ls zenwave-platform-*.vsix)
          [ "$(printf '%s\n' "$vsix" | wc -l)" -eq 1 ]
          [ "$(unzip -p "$vsix" extension/package.json | jq -r .version)" = "$VERSION" ]
          [ "$(jq -r .version release-info.json)" = "$VERSION" ]
          [ "$(jq -r .preRelease release-info.json)" = false ]
          echo "VSIX=$PWD/$vsix" >> "$GITHUB_ENV"

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The tools come from the lock in the commit, checked out above, not from a floating npx install or from anything
      # verify produced, and install scripts do not run. No repository secret is in this step's environment; the job's
      # OIDC request variables are, as in every step of a job that may publish, which is why the tree is locked. The
      # publishing steps only run what it installed (spec:release#r-r13). vsce 4.1.0 is the first to have --oidc.
      - name: Install the publishing tools from their lock
        working-directory: publish-tools
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          echo "TOOLS=$PWD/node_modules/.bin" >> "$GITHUB_ENV"

      # A token when the environment holds one, trusted publishing when it does not, and no fallback between them:
      # deleting the secret is how this moves to trusted publishing (spec:release#r-r13). --skip-duplicate counts a
      # version the registry already has as done, so a re-run only publishes where it is missing (spec:release#r-r12).
      - name: Publish to the VS Code Marketplace
        id: marketplace
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -uo pipefail
          credential=(--oidc)
          if [ -n "${VSCE_PAT:-}" ]; then
            echo "Publishing with the VSCE_PAT of this environment."
            credential=()
          else
            echo "No VSCE_PAT in this environment: publishing with trusted publishing (--oidc)."
            unset VSCE_PAT
          fi
          status=0
          "$TOOLS/vsce" publish --packagePath "$VSIX" --skip-duplicate "${credential[@]}" 2>&1 \
            | tee "$RUNNER_TEMP/marketplace.log" || status=$?
          grep -qi 'already published' "$RUNNER_TEMP/marketplace.log" && echo 'already=true' >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish the same VSIX to Open VSX
        id: openvsx
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -uo pipefail
          credential=(--trusted-publishing)
          if [ -n "${OVSX_PAT:-}" ]; then
            echo "Publishing with the OVSX_PAT of this environment."
            credential=()
          else
            echo "No OVSX_PAT in this environment: publishing with trusted publishing."
            unset OVSX_PAT
          fi
          status=0
          "$TOOLS/ovsx" publish "$VSIX" --skip-duplicate "${credential[@]}" 2>&1 \
            | tee "$RUNNER_TEMP/openvsx.log" || status=$?
          grep -qi 'already published' "$RUNNER_TEMP/openvsx.log" && echo 'already=true' >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Report what each registry did
        if: ${{ !cancelled() }}
        env:
          MARKETPLACE: ${{ steps.marketplace.outcome }}
          MARKETPLACE_HAD_IT: ${{ steps.marketplace.outputs.already }}
          OPENVSX: ${{ steps.openvsx.outcome }}
          OPENVSX_HAD_IT: ${{ steps.openvsx.outputs.already }}
        run: |
          describe() {
            case "$1" in
              success) [ "$2" = true ] && echo "already had $VERSION, nothing published" || echo "published $VERSION" ;;
              failure) echo "FAILED: $VERSION is not there" ;;
              *) echo "not attempted: $VERSION is not there" ;;
            esac
          }
          {
            echo "## Release $VERSION"
            echo
            echo "Built from \`$GITHUB_SHA\`."
            echo
            echo '| Registry | Outcome |'
            echo '| --- | --- |'
            echo "| VS Code Marketplace | $(describe "$MARKETPLACE" "$MARKETPLACE_HAD_IT") |"
            echo "| Open VSX | $(describe "$OPENVSX" "$OPENVSX_HAD_IT") |"
            echo
            echo '| Package in the VSIX | Version |'
            echo '| --- | --- |'
            jq -r '.packages | to_entries[] | "| \(.key) | \(.value) |"' artifacts/release-info.json
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MARKETPLACE" != success ] || [ "$OPENVSX" != success ]; then
            echo "::error::A version cannot be withdrawn: run this workflow's failed jobs again to finish publishing $VERSION."
            exit 1
          fi

  release:
    needs:
      - verify
      - publish
    # After the registries were tried, whichever way they went. When publish never started (the reviewer refused, or
    # verify failed) its outputs are empty and no GitHub release is made. It fails when a registry did, so the run is not
    # reported as a success, and running the failed jobs again brings the release up to date (spec:release#r-r12).
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.publish.outputs.marketplace != '' && needs.publish.outputs.marketplace != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release for the existing tag
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.ref_name }}
      MARKETPLACE: ${{ needs.publish.outputs.marketplace }}
      OPENVSX: ${{ needs.publish.outputs.openvsx }}
    steps:
      - name: Check the version is major.minor.patch
        run: |
          set -euo pipefail
          version_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$VERSION" =~ $version_re ]]; then
            echo "::error::The version from verify is not major.minor.patch with no leading zeros, so this job stops."
            exit 1
          fi

      # The notes and the VSIX are only read as data, from the build that publish used.
      - name: Download the verified VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-vsix
          path: artifacts

      - name: Create the GitHub release
        run: |
          set -euo pipefail
          [ "$TAG" = "v$VERSION" ]
          vsix=$(ls artifacts/zenwave-platform-*.vsix)
          {
            cat artifacts/release-notes.md
            echo
            echo "Built from $GITHUB_SHA. VS Code Marketplace: $MARKETPLACE. Open VSX: $OPENVSX."
          } > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run: one release, and the VSIX stays the file first attached.
            gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$(basename "$vsix")" ||
              gh release upload "$TAG" "$vsix"
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$vsix" --verify-tag --title "ZenWave Platform $VERSION" --notes-file notes.md
          fi
          echo "GitHub release: $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Do not report success when a registry failed
        if: ${{ needs.publish.result != 'success' }}
        run: |
          echo "::error::A registry did not take $VERSION, so this run is a failure; the release records the build. Run the failed jobs again to finish publishing."
          exit 1

  sync:
    needs:
      - verify
      - release
    # Only after the release, so a refused approval or a failed registry leaves develop as it is until the run is finished.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the sync branch, and merging the pull request
      pull-requests: write # open it
      actions: write # start the pre-release run on develop
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the version is major.minor.patch
        run: |
          set -euo pipefail
          version_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$VERSION" =~ $version_re ]]; then
            echo "::error::The version from verify is not major.minor.patch with no leading zeros, so this job stops."
            exit 1
          fi

      - name: Check out the history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # What goes to develop is the release commit, the tag's commit: from release/X.Y.Z when release-on-main made it and it
      # still ends there, else from a branch sync/X.Y.Z made here (a tag pushed by hand). Nothing is published here, and a
      # conflict leaves the pull request open for someone to resolve.
      - name: Merge the release commit into develop
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            echo "develop already holds the release commit; nothing to merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          head="sync/$VERSION"
          if [ "$(git rev-parse --verify --quiet "refs/remotes/origin/release/$VERSION" || true)" = "$GITHUB_SHA" ]; then
            head="release/$VERSION"
          elif ! git rev-parse --verify --quiet "refs/remotes/origin/sync/$VERSION" > /dev/null; then
            ASKPASS="$(mktemp)"
            trap 'rm -f "$ASKPASS"' EXIT
            printf '#!/bin/sh\nprintf %%s "${GITHUB_TOKEN}"\n' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            GIT_ASKPASS="$ASKPASS" git push "https://x-access-token@github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA:refs/heads/sync/$VERSION"
          fi
          number=$(gh pr list --base develop --head "$head" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            url=$(gh pr create --base develop --head "$head" \
              --title "chore: sync version" \
              --body "The release commit of v$VERSION, so develop carries its major.minor and its pre-releases stay above the release.")
            number="${url##*/}"
          fi
          if ! merged=$(git merge-tree --write-tree --name-only --no-messages origin/develop "$GITHUB_SHA"); then
            conflicts=$(printf '%s\n' "$merged" | tail -n +2)
            {
              echo "## Sync to develop needs a hand"
              echo
              echo "The release commit conflicts with develop in these files. Pull request #$number is open; resolve it there. Nothing is published again."
              echo
              printf '%s\n' "$conflicts" | sed 's/.*/- `&`/'
              echo
              echo "release-notes/next.md is the usual one: keep only what develop added after the merge to main, and none of what is in the release's notes."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Pull request #$number conflicts with develop in: $(printf '%s' "$conflicts" | tr '\n' ' ')"
            exit 1
          fi
          gh pr merge "$number" --merge --subject "chore: sync version"
          [ "$(gh pr view "$number" --json state --jq '.state')" = MERGED ]
          echo "develop holds the release commit of v$VERSION (pull request #$number)." >> "$GITHUB_STEP_SUMMARY"

      # The token's merge starts no workflow, and a develop push between the tag and this merge failed the pre-release
      # check for the old minor (spec:release#r-r8), so the pre-release is asked for here. It runs on develop only.
      - name: Start the pre-release run on develop
        run: |
          set -euo pipefail
          gh workflow run pre-release.yml --ref develop
          echo "Started pre-release.yml on develop." >> "$GITHUB_STEP_SUMMARY"
